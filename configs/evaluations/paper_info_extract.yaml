# =============================================================================
# Evaluation Configuration Template
# Optis Benchmark — Evaluation Engine Configuration
#
# Used by: src/eval.py --eval-config configs/evaluations/paper_info_extract.yaml
#
# The factory function create_evaluator() in src/evaluators/factory.py reads
# the "eval_metrics" top-level key, which is a dict mapping evaluator type
# names to their individual sub-configs.
#
# Only the "eval_metrics" section is consumed by src/eval.py.
# All other sections are informational only.
#
# Supported evaluator types (registered in EVALUATOR_MAP):
#   exact_match   — Normalized string equality across JSON entries
#   rouge         — ROUGE-1/2/L precision/recall/F1 for text fields
#   bert_score    — BERTScore precision/recall/F1 using transformer embeddings
#   citation      — Precision, recall, F1 for citation/retrieval tasks
#
# Composite scoring (dimensions, anti-patterns, LLM judge):
#   See configs/eval_scoring.yaml and src/core/composite_scorer.py
# =============================================================================

# ---------------------------------------------------------------------------
# Evaluation Metrics (required)
# Dict mapping evaluator_type -> evaluator_config.
# Multiple evaluators can be specified; each runs independently.
# ---------------------------------------------------------------------------
eval_metrics:
  # --- Exact Match Evaluator ---
  # Compares normalized string equality per JSON entry.
  exact_match:
    priority: 4
    info_names:
      - "title"
      - "publication year"
      - "doi"
      - "journal"
      - "authors"
      - "contact authors"
      - "affiliations"
      - "abstract"

  # --- ROUGE Evaluator ---
  # ROUGE-1/2/L precision/recall/F1 for text fields.
  rouge:
    priority: 3
    info_names:
      - "objective"
      - "novelty"
      - "method"
      - "performance metrics"
      - "ten keywords"
    metrics:
      - "rouge1"
      - "rouge2"
      - "rougeL"

  # --- BERTScore Evaluator ---
  # BERTScore using transformer embeddings for semantic similarity.
  bert_score:
    priority: 2
    info_names:
      - "objective"
      - "novelty"
      - "method"
      - "performance metrics"
      - "ten keywords"

  # --- Citation Evaluator ---
  # Precision, recall, F1 for retrieved papers (via DOI/title matching).
  # Extracts papers from the "papers" key in predicted/gold data.
  citation:
    priority: 1
