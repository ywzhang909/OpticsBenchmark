# =============================================================================
# Gemini Model - Google Provider Full Configuration (Interactions API)
# Optis Benchmark - LLM Prediction
# =============================================================================
#
# Google GenAI Interactions API via provider.aio.interactions.create.
# Supports generation_config, response_format, tools, and thinking.
# Reference: https://ai.google.dev/gemini-api/docs/interactions
# SDK requirement: google-genai >= 2.3.0
# Note: Only supports GoogleProvider.

# =============================================================================
# LLM Configuration (Provider + Model + Request Parameters)
# =============================================================================
llm:

  # ── Provider Configuration ──────────────────────────────────────────────────
  provider:
    # Provider type, corresponds to a key in _PROVIDER_MAP
    # Options: "google" | "openai" | "anthropic" | "ollama" | "bedrock" | "together"
    type: "google"

    # API key, read from environment variable using ${ENV_VAR} syntax
    api_key: "${GOOGLE_API_KEY}"

    # Vertex AI configuration (optional, for enterprise usage)
    vertexai: true
    project_id: "optics-agent-project"
    location: "us-central1"

  # ── Model Configuration ──────────────────────────────────────────────────────
  model:
    # Model type, corresponds to a key in _LLM_MAP, determines which LLM class to use
    # Options: "gpt" | "qwen" | "deepseek" | "llama" | "mistral" | "gemini" | "claude" | "ollama" | "glm" | "kimi"
    type: "gemini"

    # Model name, passed as the model parameter to the API
    # Commonly used: gemini-2.5-flash, gemini-2.5-pro, gemini-2.0-flash, gemini-1.5-pro
    name: "gemini-2.5-flash"

  # ── Request Parameters ──────────────────────────────────────────────────────
  setup:

    # Generation configuration, controls sampling and output parameters
    # This is a dict that maps to Google's generation_config parameter
    generation_config:
      # Sampling temperature, controls output randomness
      # Range: [0, 2], higher values produce more random output, lower values are more deterministic
      temperature: 0.0

      # Nucleus sampling probability, can be used alone or combined with temperature
      # Range: [0, 1], set to 1.0 to disable nucleus sampling
      top_p: 1.0

      # Top-k sampling, limits vocabulary to top k tokens
      # Range: [1, 500], null to disable
      top_k: 40

      # Number of response candidates to generate
      # Range: [1, 8], default 1
      candidate_count: 1

      # Maximum number of output tokens
      # Note: Actual limit is constrained by the model's context window size
      max_output_tokens: 8192

      # Stop sequences, generation stops when these strings are encountered
      # Format: ["stop1", "stop2"]
      stop_sequences: []

      # Presence penalty, encourages the model to discuss new topics
      # Range: [-2.0, 2.0]
      presence_penalty: 0.0

      # Frequency penalty, reduces repetition of the same tokens
      # Range: [-2.0, 2.0]
      frequency_penalty: 0.0

      # Random seed for reproducibility
      # Note: Best-effort, not guaranteed
      seed: 42

      # Thinking effort level (for models that support reasoning)
      # Options: "low" | "medium" | "high"
      thinking_level: "low"

      # Thinking token budget (alternative to thinking_level)
      # Range: [1024, 32768]
      thinking_budget: null

      # Enable thought summaries
      # Options: "auto" | null
      thinking_summaries: "auto"

      # Function calling mode
      tool_choice:
        # Mode: "auto" (default) | "any" | "none"
        mode: "auto"
        # Restrict to specific tools (optional)
        allowed_tools:
          mode: "any"
          tools: ["get_weather"]

    # Response format configuration
    # Controls output modality and structured output
    response_format:
      # Output modality type
      # Options: "text" | "image" | "audio"
      type: "text"

      # MIME type for structured output
      # Options: "application/json" | "text/plain"
      mime_type: "application/json"

      # JSON Schema for structured output (optional, auto-generated from gold_answer_path)
      # schema:
      #   type: "object"
      #   properties:
      #     answer: {type: "string"}
      #   required: ["answer"]
      #   additionalProperties: false

    # Tool configuration
    # Format: list of tool dicts
    tools:
      # Google Search tool, allows the model to search the internet
      - type: "google_search"

      # Code execution tool, allows the model to execute code
      - type: "code_execution"

      # Custom function declaration (example)
      # - type: "function"
      #   name: "get_weather"
      #   description: "Get current weather for a location"
      #   parameters:
      #     type: "object"
      #     properties:
      #       location: {type: "string", description: "City name"}
      #     required: ["location"]

    # Whether to enable streaming output
    # Set to true: Responses are returned via SSE streaming
    stream: false

    # Whether to store the interaction server-side
    # Set to true: Interaction is stored for later retrieval
    store: false

    # Whether to enable background execution for long tasks
    # Set to true: Request returns immediately, poll for results
    background: false

    # Safety settings configuration
    # Note: NOT supported in Interactions API, set to null
    safety_settings: null

    # Service tier selection
    # Options: "auto" | "standard" | "priority"
    service_tier: null

    # Webhook configuration for background tasks
    # Format: {"url": "https://...", "events": ["task.completed"]}
    webhook_config: null

# =============================================================================
# Task Configuration
# =============================================================================
task:
  # Dataset file path (JSON format)
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"

  # Prompt template file path (text file, first two lines are automatically skipped)
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"

  # Whether file input is required (e.g., PDF file path)
  file_input: true

  # Maximum number of samples, limits the amount of data processed (useful for testing)
  # Set to null or comment out to process all data
  max_samples: 100

  # Whether to shuffle the dataset order
  shuffle: false

  # Whether to enable structured output (JSON Schema constraint)
  # When set to true, JSON Schema will be automatically inferred from gold_answer_path
  structured_output: true

  # Gold standard answer file path, used for structured output schema inference
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

# =============================================================================
# Execution Configuration
# =============================================================================
execution:
  # Maximum concurrency, controls the number of parallel requests
  concurrency: 1

  # Timeout per task (seconds)
  timeout: 300

  # Output file path (JSONL format)
  output_path: "results/llm_outputs_gemini.jsonl"
