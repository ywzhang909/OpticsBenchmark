# =============================================================================
# Gemini 1.5 Pro - Google Provider Configuration
# Optis Benchmark - LLM Prediction
# =============================================================================

llm:
  provider:
    type: "google"
    api_key: "${GOOGLE_API_KEY}"
    vertexai: true
    project_id: "optics-agent-project"
    location: "us-central1"

  model:
    type: "gemini"
    name: "gemini-1.5-pro"

  setup:
    temperature: 0.0
    max_completion_tokens: 8192
    top_p: 1.0
    thinking:
      include_thoughts: false
      thinking_budget: 512

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 100
  shuffle: false

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs_gemini.jsonl"
