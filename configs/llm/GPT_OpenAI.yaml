# =============================================================================
# GPT-4 Turbo - OpenAI Provider Configuration
# Optis Benchmark - LLM Prediction
# =============================================================================
#
# 支持两种 OpenAI 官方调用方式，通过 setup.api_method 选择：
#   - chat_completions: Chat Completions API (client.chat.completions.create)
#   - responses:        Responses API        (client.responses.create)
#
# 两种 API 的请求参数不一致，本配置统一以通用字段定义，
# 由 GPTLLM 按 api_method 自动映射到各自参数。差异参考官方文档：
#   - Chat Completions: https://platform.openai.com/docs/api-reference/chat/create
#   - Responses:        https://platform.openai.com/docs/api-reference/responses/create
#
# 注意：legacy 模型（gpt-4-turbo、gpt-4、gpt-3.5* 等）不支持 Responses API，
# 若 api_method=responses 且模型不兼容，程序会警告并终止执行。

llm:
  provider:
    type: "openai"
    api_key: "${GPT_API_KEY}"
    base_url: "https://api.openai.com/v1"

  model:
    type: "gpt"
    name: "gpt-4-turbo"

    # Responses API samlpe
    # api_method: "responses"
    # background: false | true
    # context_management:
    #   type: "compation"
    #   compact_threshold: 10000
    # include:
    #   - "file_search_call.results"
    #   - "web_search_call.results"
    #   - "web_search_call.action.sources"
    #   - "message.input_image.image_url"
    #   - "computer_call_output.output.image_url"
    #   - "code_interpreter_call.outputs"
    #   - "reasoning.encrypted_content"
    #   - "message.output_text.logprobs"
    # max_output_tokens: 4096
    # max_tool_calls:20
    # metadata:
    #   "key1": "value1"
    #   "key2": "value2"
    # moderation:
    #   model: "omni-moderation-latest"
    #   policy: 
    #     input: "score" | "block"
    #     output: "score" | "block"
    # parallel_tool_calls: true
    # prompt_cache_key: "my_prompt_cache_key"
    # prompt_cache_options:
    #   mode: "implicit" | "explicit"
    #   ttl: 30m
    # reasoning:
    #   effort: "none" | "light" | "medium" | "heavy"
    #   context: "auto" | "current_turn" | "all_turns"
    #   mode: "standard" | "pro"
    #   summary: "auto" | "concise" | "detailed"
    # service_tier: "auto" | "default" | "flex" | "scale" | "priority" | "fast"
    # store: false | true
    # stream: false
    # stream_options:
    #   include_obfuscation: false | true
    # temperature: 0.0
    # top_logprobs: 0
    # top_p: 1.0
    # tools:
    #   web_search: false
    #   file_search: []
    #   tool_search: {}
    #   mcp_server: {}
    # tool_choice: "auto"

  setup:
    # 调用方式选择: "chat_completions" | "responses"
    api_method: "chat_completions"
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
    frequency_penalty: 0.0
    presence_penalty: 0.0
    response_format: true
    # store: false
    # tools:
    #   web_search: false
    #   file_search: []
    #   tool_search: {}
    #   mcp_server: {}
    # tool_choice: "auto"

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 100
  shuffle: false

  structured_output: true
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs.jsonl"
