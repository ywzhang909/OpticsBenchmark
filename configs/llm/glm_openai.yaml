# =============================================================================
# GLM (智谱AI) - OpenAI Provider Configuration
# OptiS Benchmark - LLM Prediction
# =============================================================================
#
# Uses OpenAI SDK to call Zhipu GLM API.
# Endpoint: https://open.bigmodel.cn/api/paas/v4

llm:
  provider:
    type: "openai"
    api_key: "${GLM_API_KEY}"
    base_url: "https://open.bigmodel.cn/api/paas/v4"

  model:
    type: "glm"
    name: "glm-4.5-air"

  setup:
    temperature: 0.0
    max_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

    response_format: true

    # tools:
    #   web_search: false
    #   file_search: []
    #   tool_search: {}
    #   mcp_server: {}
    # tool_choice: "auto"

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 100
  shuffle: false

  structured_output: true
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs.jsonl"
