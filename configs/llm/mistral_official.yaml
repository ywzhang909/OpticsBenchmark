# =============================================================================
# Mistral Large - Mistral AI Official SDK Configuration
# Optis Benchmark - LLM Prediction
# =============================================================================
#
# Uses official Mistral AI SDK (mistralai) for API calls.
# SDK: pip install mistralai
# Reference: https://docs.mistral.ai/studio/conversations/chat-completion

llm:
  provider:
    type: "mistral"
    api_key: "${MISTRAL_API_KEY}"

  model:
    type: "mistral"
    name: "mistral-large-latest"

    # Mistral SDK chat.complete_async parameters:
    # temperature: 0.0                                # sampling temperature (0.0-0.7)
    # top_p: 1.0                                     # nucleus sampling threshold
    # max_tokens: 4096                               # max tokens in response
    # stop: []                                       # stop sequences
    # random_seed: 42                                # random seed for reproducibility
    # presence_penalty: 0.0                          # penalize new tokens based on presence
    # frequency_penalty: 0.0                         # penalize new tokens based on frequency
    # n: 1                                           # number of completions
    # safe_prompt: false                             # moderate against sensitive content
    # parallel_tool_calls: true                      # parallel tool calls
    # reasoning_effort: "low" | "medium" | "high"    # reasoning effort level
    # prompt_mode: ...                               # prompt mode
    # prompt_cache_key: "..."                        # prompt cache key
    # response_format:
    #   type: "json_object"                          # structured output (json_object)
    #   type: "json_schema"                          # structured output (json_schema)
    #     json_schema:
    #       name: "response_schema"
    #       strict: true
    #       schema:
    #         type: "object"
    #         properties:
    #           answer: {type: "string"}
    #         required: ["answer"]
    #         additionalProperties: false
    # tools:
    #   function_declarations:                       # custom function declarations
    #     - name: "get_weather"
    #       description: "Get current weather for a location"
    #       parameters:
    #         type: "object"
    #         properties:
    #           location: {type: "string", description: "City name"}
    #         required: ["location"]
    # tool_choice: "auto" | "any" | "none"           # function calling mode

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    response_format: true

    # Tools configuration
    # tools:
    #   function_declarations:
    #     - name: "get_optical_property"
    #       description: "Get optical property of a material"
    #       parameters:
    #         type: "object"
    #         properties:
    #           material: {type: "string", description: "Material name"}
    #           wavelength: {type: "number", description: "Wavelength in nm"}
    #         required: ["material", "wavelength"]
    # tool_choice: "auto"

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 10
  shuffle: false

  structured_output: true
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs_mistral.jsonl"
