# =============================================================================
# DeepSeek V4 Pro - OpenAI Provider Configuration
# OptiS Benchmark - LLM Prediction
# =============================================================================

llm:
  provider:
    type: "openai"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"

  model:
    type: "deepseek"
    name: "deepseek-v4-pro"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0

    response_format: true

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 100
  shuffle: false

  structured_output: true
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs.jsonl"
