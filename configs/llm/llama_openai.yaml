# =============================================================================
# Llama 4 Scout - Together AI Configuration (OpenAI SDK)
# Optis Benchmark - LLM Prediction
# =============================================================================
#
# Uses OpenAI SDK to call Together AI API (OpenAI-compatible).
# Endpoint: https://api.together.ai/v1
# Reference: https://docs.together.ai/docs/inference/openai-compatibility
#
# Together AI 参数兼容性（来自官方文档）：
#   - temperature, top_p, max_tokens: ✅ 完全支持
#   - frequency_penalty, presence_penalty: ✅ 支持
#   - stop, seed, n: ✅ 支持（n 部分模型）
#   - response_format (json_object/json_schema): ✅ 支持
#   - tools, tool_choice: ✅ 支持
#   - logprobs, top_logprobs: ✅ 支持（格式略有不同）
#   - reasoning_effort: ⚠️ 仅 GPT-OSS 模型
#   - logit_bias: ❌ 大部分模型不支持
#   - service_tier, store, metadata: ⚠️ 接受但忽略
# 若输入不支持的参数，API 将返回错误并记录日志。

llm:
  provider:
    type: "openai"
    api_key: "${TOGETHER_API_KEY}"
    base_url: "https://api.together.ai/v1"

  model:
    type: "llama"
    name: "meta-llama/Llama-4-Scout-17B-16E-Instruct"

    # Chat Completions API sample (Together AI OpenAI-compatible)
    # temperature: 0.0                                # sampling temperature (0.0-2.0)
    # top_p: 1.0                                     # nucleus sampling threshold
    # max_tokens: 4096                               # max tokens in response
    # frequency_penalty: 0.0                         # penalize new tokens based on frequency
    # presence_penalty: 0.0                          # penalize new tokens based on presence
    # logit_bias: {}                                 # ❌ not supported on most models
    # metadata: {}                                   # ⚠️ accepted but ignored
    # n: 1                                           # ⚠️ supported on most models
    # parallel_tool_calls: true                      # parallel tool calls
    # reasoning_effort: "low" | "medium" | "high"    # ⚠️ GPT-OSS models only
    # service_tier: "auto"                           # ⚠️ accepted but ignored
    # stop: []                                       # stop sequences
    # store: false                                   # ⚠️ accepted but ignored
    # web_search_options: {}                         # web search options
    # logprobs: false                                # return log probabilities
    # top_logprobs: 0                                # number of top log probabilities
    # seed: 42                                       # ⚠️ best-effort, not guaranteed
    # response_format:
    #   type: "json_object"                          # structured output (json_object)
    #   type: "json_schema"                          # structured output (json_schema)
    #     json_schema:
    #       name: "response_schema"
    #       strict: true
    #       schema:
    #         type: "object"
    #         properties:
    #           answer: {type: "string"}
    #         required: ["answer"]
    #         additionalProperties: false
    # tools:
    #   function_declarations:                       # custom function declarations
    #     - name: "get_weather"
    #       description: "Get current weather for a location"
    #       parameters:
    #         type: "object"
    #         properties:
    #           location: {type: "string", description: "City name"}
    #         required: ["location"]
    # tool_choice: "auto" | "any" | "none"           # function calling mode

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    response_format: true

    # Structured output: auto-generate JSON Schema from gold_answer_path
    # or specify schema directly in setup

    # Tools configuration
    # tools:
    #   function_declarations:
    #     - name: "get_optical_property"
    #       description: "Get optical property of a material"
    #       parameters:
    #         type: "object"
    #         properties:
    #           material: {type: "string", description: "Material name"}
    #           wavelength: {type: "number", description: "Wavelength in nm"}
    #         required: ["material", "wavelength"]
    # tool_choice: "auto"

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 10
  shuffle: false

  structured_output: true
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs_together.jsonl"
