# =============================================================================
# Mistral Mixtral 8x7B - Together AI Configuration
# Optis Benchmark - LLM Prediction
# =============================================================================

llm:
  provider:
    type: "together"
    api_key: "${TOGETHER_API_KEY}"

  model:
    type: "mistral"
    name: "mistralai/Mixtral-8x7B-Instruct-v0.1"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

task:
  dataset_path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  prompt_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  file_input: true
  max_samples: 10
  shuffle: false

execution:
  concurrency: 1
  timeout: 300
  output_path: "results/llm_outputs_mistral_together.jsonl"
