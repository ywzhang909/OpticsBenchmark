# =============================================================================
# Qwen 3 Max Configuration
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Uses OpenAI-compatible SDK to call DeepSeek API.
# Endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1

agent:
  name: "optis-qwen"
  version: "1.0.0"
  description: "Qwen 3 Max Optical Design Agent"

model:
  provider: "openai"
  name: "qwen3-max"
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${QWEN_API_KEY}"

  temperature: 0.0
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0

system_prompt_file: "prompts/system/optical_agent.txt"

tools:
  enabled:
    - "file_read"
    - "file_write"
    - "bash_execute"
    - "python_execute"
    - "optical_api"

  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
