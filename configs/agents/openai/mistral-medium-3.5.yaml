# =============================================================================
# Mistral Medium 3.5 Agent Configuration
# Optis Benchmark - Agent Settings
# =============================================================================

agent:
  name: "optis-mistral-medium-3-5-agent"
  version: "1.0.0"
  description: "Mistral Medium 3.5 Optical Design Agent (OpenAI-compatible)"

model:
  provider: "openai"
  name: "mistral-medium-3-5"
  api_base: "https://api.mistral.ai/v1"
  api_key: "${MISTRAL_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

    api_params:
      n: 1
      store: false

system_prompt_file: "prompts/system/optical_agent.txt"

# Tool Configuration
tools:
  mcp_server:
    server_label: "optis-mcp-server"
    server_description: "Optical Design AI Server"
    server_url: "http://localhost:8000"
    require_approval: true

  web_search: true

  file_search:
    - "paper1.pdf"
    - "paper2.pdf"

  tool_search:
    name: "optics_namespace"
    description: "Search for optics namespace"

  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
