# =============================================================================
# Qwen 3 Max Configuration
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Uses OpenAI-compatible SDK to call DeepSeek API.
# Endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1

agent:
  name: "optis-qwen"
  version: "1.0.0"
  description: "Qwen 3 Max Optical Design Agent"

model:
  provider: "openai"
  name: "qwen3-max"
  api_base: "http://localhost:8001/v1"
  api_key: "${QWEN_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

    # Qwen-specific parameters passed via OpenAI SDK's extra_body.
    # See https://docs.qwencloud.com/api-reference/chat/openai-chat
    extra_body:
      enable_thinking: true

system_prompt_file: "prompts/system/optical_agent.txt"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
