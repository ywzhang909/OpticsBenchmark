# =============================================================================
# DeepSeek V4 Pro Configuration
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Uses Anthropic SDK to call DeepSeek API.
# Endpoint: https://api.deepseek.com

agent:
  name: "optis-deepseek"
  version: "1.0.0"
  description: "DeepSeek V4 Pro Optical Design Agent"

model:
  provider: "openai"
  name: "deepseek-v4-pro"
  api_base: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

system_prompt_file: "prompts/system/optical_agent.txt"

tools:
  enabled:
    - "file_read"
    - "file_write"
    - "bash_execute"
    - "python_execute"
    - "optical_api"

  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
