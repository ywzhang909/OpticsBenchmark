# =============================================================================
# Groq Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your Groq model.

agent:
  name: "optis-groq-agent"
  version: "1.0.0"
  description: "Groq Optical Design Agent"

model:
  provider: "groq"
  name: "llama-3.3-70b-versatile"
  api_base: "https://api.groq.com/openai/v1"
  api_key: "${GROQ_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0

system_prompt_file: "prompts/system/optical_agent.txt"

# Tool Configuration
# Groq supports OpenAI-compatible function calling.
tools:
  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
