# =============================================================================
# Anthropic Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your Anthropic model.

agent:
  name: "optis-anthropic-agent"
  version: "1.0.0"
  description: "Anthropic Optical Design Agent"

model:
  provider: "anthropic"
  name: "claude-3-5-sonnet-20241022"
  api_base: "https://api.anthropic.com"
  api_key: "${ANTHROPIC_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0

provider_settings:
  thinking_budget: 16000

system_prompt_file: "prompts/system/optical_agent.txt"

# Tool Configuration
# Anthropic supports tool use (function calling) via the Messages API.
# See: https://docs.anthropic.com/en/docs/build-with-claude/tool-use
# See: https://docs.anthropic.com/en/docs/build-with-claude/agentic-tools
#
# Supported tool categories (all optional, keep or remove as needed):
#   mcp_server  — Connect an external MCP server for Claude to invoke its tools
#   web_search  — Enable web search capability
#   web_fetch   — Enable web page content fetching
#   tool_search — Wrap the above tools into a namespace for dynamic tool search
tools:
# ── MCP Server ──────────────────────────────────────────────────────
# Connect to an external server via MCP (Model Context Protocol) so
# Claude can invoke the tools it exposes. All fields are forwarded
# verbatim to the Anthropic API.
# Ref: https://docs.anthropic.com/en/docs/agents-and-tools/mcp
  mcp_server: 
    type: "url"
    url: "https://example-server.modelcontextprotocol.io/sse"
    name: "example-mcp"
    authorization_token: "YOUR_TOKEN"

# ── Web Search ──────────────────────────────────────────────────────
# Web search tool that lets Claude retrieve real-time information.
# Supported parameters (see API docs for details):
#   max_uses        — Max searches per request (unlimited by default;
#                     1-3 for factual queries, 15-20 for research)
#   allowed_domains — Only return results from these domains
#   blocked_domains — Exclude results from these domains
#   user_location   — Localize search results by geographic location
# Ref: https://docs.anthropic.com/en/docs/build-with-claude/web-search-tool
  web_search:
    type: "web_search_20250305"
    name: "web_search"
    # Optional: Limit the number of searches per request
    max_uses: 5,

    # Optional: Only include results from these domains
    allowed_domains: ["example.com", "trusteddomain.org"]

    # Optional: Never include results from these domains
    blocked_domains: ["untrustedsource.com"]

    # Optional: Localize search results
    user_location: 
      type: "approximate"
      city: "San Francisco"
      region: "California"
      country: "US"
      timezone: "America/Los_Angeles"

# ── Web Fetch ───────────────────────────────────────────────────────
# Web page content fetching tool. Claude can retrieve full text from
# a given URL.
# Supported parameters (see API docs for details):
#   max_uses           — Max fetches per request (unlimited by default)
#   allowed_domains    — Only fetch from these domains
#   blocked_domains    — Never fetch from these domains
#   citations.enabled  — Enable citation annotations for source attribution
#   max_content_tokens — Max content length per fetch (approximate;
#                        helps control token usage on large documents)
# Note: You must include citations pointing to original sources when
# displaying API output to end users.
# Ref: https://docs.anthropic.com/en/docs/build-with-claude/web-fetch-tool
  web_fetch:
    type: "web_fetch_20250910"
    name: "web_fetch"

    # Optional: Limit the number of fetches per request
    max_uses: 10,

    # Optional: Only fetch from these domains
    allowed_domains: ["example.com", "docs.example.com"]

    # Optional: Never fetch from these domains
    blocked_domains: ["private.example.com"]

    # Optional: Enable citations for fetched content
    citations: 
      enabled: true

    # Optional: Maximum content length in tokens
    max_content_tokens: 100000

# ── Tool Search ─────────────────────────────────────────────────────
# Wraps tools (mcp, web_search, web_fetch, etc.) into a namespace so
# Claude can dynamically search and select the right tool at runtime.
# Two search modes (choose one):
#   tool_search_tool_regex_20251119 — Claude builds a regex to match tools
#   tool_search_tool_bm25_20251119  — Claude uses natural language BM25 search
# Ref: https://docs.anthropic.com/en/docs/build-with-claude/agentic-tools
  tool_search:
    type: "tool_search_tool_regex_20251119" # or "tool_search_tool_bm25_20251119"
    name: "tool_search_tool_regex" # or "tool_search_tool_bm25"

# tool_choice controls how Claude decides to use tools:
#   "auto" — Claude decides autonomously whether to call tools
#   "any"  — Force Claude to call at least one tool on every turn
#   {"type": "tool", "name": "xxx"} — Force Claude to use a specific tool
  tool_choice: "auto"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
