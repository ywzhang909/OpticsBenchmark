# =============================================================================
# Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your agent/provider.
# Remove or comment out sections that don't apply.

# Agent Identity
agent:
  name: "optis-agent"
  version: "1.0.0"
  description: "Optical Design AI Agent"

# Model Configuration
model:
  # Supported providers: openai, anthropic, google, groq, ollama, bedrock, together
  provider: "openai"
  name: "gpt-4-turbo"
  api_base: "https://api.openai.com/v1"

  # Authentication (use environment variables in production)
  api_key: "${OPENAI_API_KEY}"

  # Model Parameters
  temperature: 0.0
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0

  # Extra params passed directly to the API client call.
  # Supports any provider-specific API parameter.
  # Example for OpenAI Responses API:
  #   See: https://developers.openai.com/api/reference/resources/responses/methods/create
  # api_params:
  #   store: true
  #   metadata:
  #     session: "optis-benchmark"
  #   include:
  #     - "message.input_image.image_url"

# System Prompt
system_prompt_file: "prompts/system/optical_agent.txt"

# Tool Configuration
tools:
  enabled:
    - "file_read"
    - "file_write"
    - "bash_execute"
    - "python_execute"
    - "optical_api"

  # Optical software integration
  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"     # zosapi, com
      workspace_path: "/tmp/zemax_workspace"

# Execution Settings
execution:
  max_retries: 3
  timeout: 300               # seconds
  cache_enabled: true
  cache_ttl: 3600           # seconds

# Cost Tracking
cost_tracking:
  enabled: true
  log_api_usage: true
