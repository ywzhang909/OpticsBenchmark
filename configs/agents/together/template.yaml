# =============================================================================
# Together AI Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your Together AI model.

agent:
  name: "optis-together-agent"
  version: "1.0.0"
  description: "Together AI Optical Design Agent"

model:
  provider: "together"
  name: "mistralai/Mixtral-8x22B-Instruct-v0.1"
  api_base: "https://api.together.xyz"
  api_key: "${TOGETHER_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0

system_prompt_file: "prompts/system/optical_agent.txt"

tools:
  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
