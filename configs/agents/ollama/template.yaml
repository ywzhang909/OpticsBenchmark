# =============================================================================
# Ollama Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your local Ollama model.

agent:
  name: "optis-ollama-agent"
  version: "1.0.0"
  description: "Ollama Local Optical Design Agent"

model:
  provider: "ollama"
  name: "llama3.2"
  api_key: ""

  setup:
    temperature: 0.0
    max_completion_tokens: 4096

provider_settings:
  ollama_host: "http://localhost:11434"

system_prompt_file: "prompts/system/optical_agent.txt"

tools:
  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
