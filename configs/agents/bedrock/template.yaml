# =============================================================================
# AWS Bedrock Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your Bedrock model.

agent:
  name: "optis-bedrock-agent"
  version: "1.0.0"
  description: "AWS Bedrock Optical Design Agent"

model:
  provider: "bedrock"
  name: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  api_base: "us-east-1"
  api_key: "${AWS_ACCESS_KEY_ID}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0

system_prompt_file: "prompts/system/optical_agent.txt"

tools:
  optical_software:
    zemax:
      enabled: true
      connection: "zosapi"
      workspace_path: "/tmp/zemax_workspace"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
