# =============================================================================
# Google Gemini Agent Configuration Template
# OptiS Benchmark - Agent Settings
# =============================================================================
#
# Copy this file and customize for your Gemini model.

agent:
  name: "optis-gemini-agent"
  version: "1.0.0"
  description: "Gemini Optical Design Agent"

model:
  provider: "google"
  name: "gemini-2.0-flash"
  api_key: "${GEMINI_API_KEY}"

  setup:
    temperature: 0.0
    max_completion_tokens: 4096
    top_p: 1.0
    top_k: 40
    candidate_count: 1

system_prompt_file: "prompts/system/optical_agent.txt"

# Tool Configuration
# Gemini supports Google Search grounding and function calling.
# File search is handled via file upload as context.
tools:
  web_search: true

  file_search:
    - "paper1.pdf"
    - "paper2.pdf"

  file_search_store_name: "optics_paper"

  embedding_model: "gemini-2.0-flash"

execution:
  max_retries: 3
  timeout: 300
  cache_enabled: true
  cache_ttl: 3600

cost_tracking:
  enabled: true
  log_api_usage: true
