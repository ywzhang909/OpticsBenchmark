# =============================================================================
# Paper Information Extract Task Configuration
# Optis Benchmark
# =============================================================================

task:
  id: "paper_info_extract"
  name: "Paper Information Extract"
  description: "The objective is to extract information for 13 specific fields from optical science paper: Title, Publication Year, DOI, Journal, Ten Keywords, Authors, Corresponding Authors, Affiliations, Abstract, Objectives, Novelty, Methods, and Performance Metrics. The extracted information must be returned in JSON format."
  category: "paper_info_extract"
  difficulty: 2
  estimated_time: 10

  # Whether the task requires file input (e.g., PDF)
  file_input: true

  # Structured output settings
  structured_output: true
  gold_answer_path: "dataset/paper_info_extract/dataset_json/gold_answer_v1.json"

  # Tags for filtering
  tags:
    - "optical"
    - "design"
    - "beginner"
# Dataset Configuration
dataset:
  path: "dataset/paper_info_extract/dataset_json/dataset_v1.json"
  num_samples: 100             # Number of samples to evaluate
  shuffle: false
  
  # Data format
  format:
    input_field: "instruction"
    output_field: "expected_output"
    metadata_fields:
      - "task_id"
      - "title"
      - "location"

# Environment Configuration
environment:
  type: "optical_sandbox"
  
  software:
    required:
      - name: "zemax"
        version: "2023.1+"
    optional:
      - name: "python"
        version: "3.10+"
  
  # Sandbox settings
  sandbox:
    timeout: 300               # seconds
    max_steps: 50
    memory_limit: "4GB"

# Prompt Configuration
prompt:
  task_file: "prompts/paper_info_extract/zero-shot_v1.0.txt"
  template_file: "prompts/templates/template_task.txt"
  
  # Variables to inject
  variables:
    task_description: "${task.description}"
    constraints: "${task.constraints}"
    evaluation_criteria: "${evaluation.success_criteria}"

# Cost Configuration
cost:
  max_cost_per_task: 5.0       # USD
  budget_per_task: 10.0        # USD
