# =============================================================================
# Fine-tuning Configuration - Together AI Provider (Llama)
# Optis Benchmark - Fine-tune Job Management
# =============================================================================
#
# This file only describes "the fine-tuning job itself" (the parameters sent to
# the Together AI fine-tuning API and the client behaviour).
#
# Workflow (a two-stage explicit pipeline; the data files are the only contract
# between the two stages):
#   Stage A: utils/build_finetune_dataset.py converts the gold answer + prompt into
#            the Together AI fine-tuning JSONL format (training_file / validation_file)
#   Stage B: python src/finetune.py -c <this file> [--wait] runs the fine-tune job
#            management
#
# Once fine-tuning completes, put the model name recorded in status_output_path
# (of the form together/<base_model>-<suffix>-<job_id>) into the model.name field
# of configs/llm/llama_openai.yaml to reuse the existing inference/evaluation pipeline.
#
# Official documentation:
#   - Create a job: https://docs.together.ai/reference/post-fine-tunes
#   - Fine-tuning guide: https://docs.together.ai/docs/fine-tuning/supervised

# =============================================================================
# LLM Provider Configuration (credentials only, used to create the API client)
# =============================================================================
llm:

  provider:
    # Provider type, corresponding to a key in _PROVIDER_MAP; fine-tuning
    # supports "together"
    type: "together"

    # API key, read from an environment variable using the ${ENV_VAR} syntax
    # (same convention as llama_openai.yaml)
    api_key: "${TOGETHER_API_KEY}"

    # API endpoint URL, using the default of the official SDK (together-py),
    # https://api.together.ai/v1.
    # Note: the /v1 suffix is mandatory! The SDK appends /fine-tunes and /files
    # as relative paths.
    base_url: "https://api.together.ai/v1"

# =============================================================================
# Fine-tuning Configuration (mapped to the POST /v1/fine-tunes request body)
# =============================================================================
fine_tuning:

  # ── Training data ───────────────────────────────────────────────────────────
  # Path to the JSONL file pre-generated by utils/build_finetune_dataset.py
  training_file: "dataset/fine_tune/paper_info_extract/test.jsonl"

  # Optional validation set JSONL path; null means no validation set
  # The validation set is used for loss evaluation during training and does not
  # participate in weight updates
  validation_file: null

  # ── Base model ──────────────────────────────────────────────────────────────
  # Must be a model name that Together AI supports fine-tuning for
  # Common: meta-llama/Meta-Llama-3.1-8B-Instruct-Reference,
  #         meta-llama/Llama-3.2-3B-Instruct, meta-llama/Llama-3.3-70B-Instruct-Turbo
  base_model: "meta-llama/Meta-Llama-3.1-8B-Instruct-Reference"

  # ── Task parameters ─────────────────────────────────────────────────────────
  # Fine-tuning method: "supervised" (SFT, default) | "dpo" (direct preference optimization)
  # Leaving this field empty or removing it = supervised (server default);
  # specify training_method explicitly only for dpo
  method: "supervised"

  # Custom suffix for the model name, at most 64 characters, appended to the
  # output model name
  suffix: "optis-bench"

  # Random seed (mapped to Together's random_seed field), used to improve
  # reproducibility; null means the server picks the default
  random_seed: null

  # Hyperparameters. Together AI sends them as top-level request body fields
  # (not as a nested hyperparameters object), matching the flat parameters of the
  # official SDK fine_tuning.create one-to-one.
  n_epochs: 3

  # Batch size: a positive integer or "max"
  batch_size: "max"

  # Learning rate: a number, default 1e-5
  learning_rate: 0.00001

  # Warmup step ratio: 0 ~ 1
  warmup_ratio: 0.0

  # Weight decay: regularization parameter, default 0
  weight_decay: 0.0

  # Max norm for gradient clipping: set to 0 to disable, default 1
  max_grad_norm: 1.0

# =============================================================================
# Execution Configuration (client behaviour, not API parameters)
# =============================================================================
execution:
  # Polling interval in --wait mode (seconds)
  poll_interval: 60

  # Maximum wait duration in --wait mode (seconds); on timeout it exits and keeps
  # the job id for later lookup
  poll_timeout: 86400

  # Path where the job status is persisted: the job id is written after creation,
  # and the fine_tuned_model name is appended on success
  status_output_path: "results/finetune/job_status_together.json"
