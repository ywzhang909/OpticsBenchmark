# =============================================================================
# Fine-tuning Configuration - Mistral AI Provider (Ministral)
# Optis Benchmark - Fine-tune Job Management
# =============================================================================
#
# This file only describes "the fine-tuning job itself" (the parameters sent to
# the Mistral AI fine-tuning API and the client behaviour).
#
# Workflow (a two-stage explicit pipeline; the data files are the only contract
# between the two stages):
#   Stage A: utils/build_finetune_dataset.py converts the gold answer + prompt into
#            the Mistral AI fine-tuning JSONL format (train.jsonl / val.jsonl)
#   Stage B: python src/finetune.py -c <this file> [--wait] runs the fine-tune job
#            management
#
# Once fine-tuning completes, put the model name recorded in status_output_path
# (of the form ft:ministral-3b-latest:...) into the model.name field of
# configs/llm/mistral_official.yaml to reuse the existing inference/evaluation pipeline.
#
# Official documentation:
#   - Fine-tuning overview: https://docs.mistral.ai/capabilities/finetuning/
#   - Text/vision fine-tuning: https://docs.mistral.ai/resources/deprecated/finetuning/text_vision_finetuning

# =============================================================================
# LLM Provider Configuration (credentials only, used to create the API client)
# =============================================================================
llm:

  provider:
    # Provider type, corresponding to a key in _PROVIDER_MAP
    # The current fine-tuning feature supports "mistral"
    type: "mistral"

    # API key, read from an environment variable using the ${ENV_VAR} syntax
    # (same convention as mistral_official.yaml)
    api_key: "${MISTRAL_API_KEY}"

# =============================================================================
# Fine-tuning Configuration (mapped to client.fine_tuning.jobs.create())
# =============================================================================
fine_tuning:

  # ── Training data ───────────────────────────────────────────────────────────
  # Path to the JSONL file pre-generated by utils/build_finetune_dataset.py
  training_file: "dataset/fine_tune/paper_info_extract/test.jsonl"

  # Optional validation set JSONL path; null means no validation set
  # The validation set is used for loss evaluation during training and does not
  # participate in weight updates
  validation_file: null

  # ── Base model ──────────────────────────────────────────────────────────────
  # Must be a model name that Mistral AI supports fine-tuning for
  # Common: ministral-3b-latest, ministral-8b-latest, mistral-small-latest,
  #         mistral-large-latest, open-mistral-7b
  base_model: "ministral-3b-2512"

  # ── Task parameters ─────────────────────────────────────────────────────────
  # Custom suffix for the model name, appended to the output model name
  suffix: "optis-mistral"

  # Random seed, used to improve reproducibility; null means the server picks it
  seed: null

  # Hyperparameters, using Mistral's native fields (mapped to TrainingParameters)
  hyperparameters:
    # Number of training steps: a positive integer
    training_steps: 10

    # Learning rate
    learning_rate: 0.0001

    # Weight decay: regularization parameter, default 0
    weight_decay: 0.0

    # Warmup step ratio: 0 ~ 1
    warmup_fraction: 0.1

# =============================================================================
# Execution Configuration (client behaviour, not API parameters)
# =============================================================================
execution:
  # Polling interval in --wait mode (seconds)
  poll_interval: 30

  # Maximum wait duration in --wait mode (seconds); on timeout it exits and keeps
  # the job id for later lookup
  poll_timeout: 86400

  # Path where the job status is persisted: the job id is written after creation,
  # and the fine_tuned_model name is appended on success
  status_output_path: "results/finetune/job_status_mistral.json"
