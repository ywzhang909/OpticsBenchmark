# =============================================================================
# Fine-tuning Configuration - OpenAI Provider
# Optis Benchmark - Fine-tune Job Management
# =============================================================================
#
# 本文件仅描述"微调任务本身"（发送给 OpenAI fine_tuning API 的参数与客户端行为）。
#
# 工作流（两阶段显式流水线，数据文件是两阶段唯一契约）：
#   阶段 A：utils/build_finetune_dataset.py 将 gold answer + prompt 转换为
#           OpenAI 微调 JSONL 格式（training_file / validation_file）
#   阶段 B：python src/finetune.py -c <本文件> [--wait] 执行微调任务管理
#
# 微调完成后，将 status_output_path 中记录的 ft:gpt-4o-mini:... 模型名填入
# configs/llm/GPT_OpenAI.yaml 的 model.name 即可复用现有推理/评测管线。
#
# 官方文档：
#   - 创建任务: https://platform.openai.com/docs/api-reference/fine-tuning/create
#   - 微调指南: https://platform.openai.com/docs/guides/fine-tuning

# =============================================================================
# LLM Provider Configuration (仅凭证，用于创建 API client)
# =============================================================================
llm:

  provider:
    # Provider 类型，对应 _PROVIDER_MAP 中的 key
    # 当前微调功能仅支持 "openai"
    type: "openai"

    # API key，使用 ${ENV_VAR} 语法从环境变量读取
    api_key: "${GPT_API_KEY}"

    # API 端点地址，默认为 OpenAI 官方
    base_url: "https://api.openai.com/v1"

# =============================================================================
# Fine-tuning Configuration (映射到 client.fine_tuning.jobs.create() 参数)
# =============================================================================
fine_tuning:

  # ── 训练数据 ────────────────────────────────────────────────────────────────
  # 由 utils/build_finetune_dataset.py 预先生成的 JSONL 文件路径
  # 每行格式: {"messages": [{"role": "system", ...}, {"role": "user", ...},
  #                          {"role": "assistant", ...}]}
  training_file: "dataset/fine_tune/paper_info_extract/test.jsonl"

  # 可选验证集 JSONL 路径，null 表示不使用
  # 验证集用于训练过程中的 loss 评估，不参与权重更新
  validation_file: null

  # ── 基座模型 ────────────────────────────────────────────────────────────────
  # 必须为支持微调的快照版本（不能使用 gpt-4o 等别名）
  # 常用: gpt-4o-mini-2024-07-18, gpt-4o-2024-08-06, gpt-4.1-mini-2025-04-14
  # 任务运行前会通过 client.models.list() 自动校验可微调性
  base_model: "gpt-4o-mini-2024-07-18"

  # ── 任务参数 ────────────────────────────────────────────────────────────────
  # 微调方法: "supervised" (SFT) | "dpo" (直接偏好优化)
  method: "supervised"

  # 模型名自定义后缀，最多 18 字符（字母/数字/连字符/下划线）
  # 最终模型名形如: ft:gpt-4o-mini:<org>:optis-bench:<job_id>
  suffix: "optis-bench"

  # 随机种子，用于提升结果可复现性；null 表示由服务端随机指定
  seed: null

  # 超参数，各字段均可为数值或 "auto"（由服务端根据数据量决定）
  hyperparameters:
    # 训练轮数: 正整数或 "auto"（gpt-4o-mini 默认 3）
    n_epochs: 3

    # 批大小: 正整数或 "auto"
    batch_size: "auto"

    # 学习率倍率: 数值或 "auto"（约在 0.02 ~ 0.2 之间）
    learning_rate_multiplier: "auto"

# =============================================================================
# Execution Configuration (客户端行为，非 API 参数)
# =============================================================================
execution:
  # --wait 模式的轮询间隔（秒）
  poll_interval: 30

  # --wait 模式的最长等待时长（秒），超时后退出并保留 job id 供后续查询
  poll_timeout: 86400

  # 任务状态落盘路径：任务创建后写入 job id，成功后追加 fine_tuned_model 名
  status_output_path: "results/finetune/job_status.json"
