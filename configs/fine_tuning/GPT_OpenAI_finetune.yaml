# =============================================================================
# Fine-tuning Configuration - OpenAI Provider
# Optis Benchmark - Fine-tune Job Management
# =============================================================================
#
# This file only describes "the fine-tuning job itself" (the parameters sent to
# the OpenAI fine_tuning API and the client behaviour).
#
# Workflow (a two-stage explicit pipeline; the data files are the only contract
# between the two stages):
#   Stage A: utils/build_finetune_dataset.py converts the gold answer + prompt into
#            the OpenAI fine-tuning JSONL format (training_file / validation_file)
#   Stage B: python src/finetune.py -c <this file> [--wait] runs the fine-tune job
#            management
#
# Once fine-tuning completes, put the ft:gpt-4o-mini:... model name recorded in
# status_output_path into the model.name field of configs/llm/GPT_OpenAI.yaml to
# reuse the existing inference/evaluation pipeline.
#
# Official documentation:
#   - Create a job: https://platform.openai.com/docs/api-reference/fine-tuning/create
#   - Fine-tuning guide: https://platform.openai.com/docs/guides/fine-tuning

# =============================================================================
# LLM Provider Configuration (credentials only, used to create the API client)
# =============================================================================
llm:

  provider:
    # Provider type, corresponding to a key in _PROVIDER_MAP
    # The current fine-tuning feature supports "openai" only
    type: "openai"

    # API key, read from an environment variable using the ${ENV_VAR} syntax
    api_key: "${GPT_API_KEY}"

    # API endpoint URL, defaulting to the official OpenAI endpoint
    base_url: "https://api.openai.com/v1"

# =============================================================================
# Fine-tuning Configuration (mapped to client.fine_tuning.jobs.create())
# =============================================================================
fine_tuning:

  # ── Training data ───────────────────────────────────────────────────────────
  # Path to the JSONL file pre-generated by utils/build_finetune_dataset.py
  # Line format: {"messages": [{"role": "system", ...}, {"role": "user", ...},
  #                          {"role": "assistant", ...}]}
  training_file: "dataset/fine_tune/paper_info_extract/test.jsonl"

  # Optional validation set JSONL path; null means no validation set
  # The validation set is used for loss evaluation during training and does not
  # participate in weight updates
  validation_file: null

  # ── Base model ──────────────────────────────────────────────────────────────
  # Must be a snapshot version that supports fine-tuning (aliases such as gpt-4o
  # cannot be used)
  # Common: gpt-4o-mini-2024-07-18, gpt-4o-2024-08-06, gpt-4.1-mini-2025-04-14
  # Fine-tunability is verified automatically via client.models.list() before the
  # job runs
  base_model: "gpt-4o-mini-2024-07-18"

  # ── Task parameters ─────────────────────────────────────────────────────────
  # Fine-tuning method: "supervised" (SFT) | "dpo" (direct preference optimization)
  #                     | "reinforcement" (reinforcement learning)
  # Leaving this field empty or removing it = use the OpenAI default method
  # (method is not sent in the request body) and a note is logged
  # Note: when method is set, hyperparameters must also be provided, otherwise
  # the job aborts with an error.
  # When method = "reinforcement" you must also provide a grader config block
  # (see the example in the comments below).
  method: "supervised"

  # Custom suffix for the model name, at most 18 characters
  # (letters/digits/hyphens/underscores)
  # The final model name looks like: ft:gpt-4o-mini:<org>:optis-bench:<job_id>
  suffix: "optis-bench"

  # Random seed, used to improve reproducibility; null means the server picks it
  seed: null

  # Hyperparameters; every field accepts a number or "auto" (the server decides
  # based on the dataset size)
  hyperparameters:
    # Number of epochs: a positive integer or "auto" (gpt-4o-mini defaults to 3)
    n_epochs: 3

    # Batch size: a positive integer or "auto"
    batch_size: "auto"

    # Learning rate multiplier: a number or "auto" (roughly 0.02 ~ 0.2)
    learning_rate_multiplier: "auto"

  # ── Required only when method = "reinforcement" ─────────────────────────────
  # grader: StringCheckGrader configuration (mapped to
  #   fine_tuning.jobs.create -> method.reinforcement.grader), with these fields:
  #   name: "Example string check grader"
  #   type: "string_check"
  #   input: "{{item.label}}"
  #   operation: "eq"
  #   reference: "{{sample.output_text}}"
  # For the supervised / dpo methods, keep this commented out (leave it empty).
  # grader: null

# =============================================================================
# Execution Configuration (client behaviour, not API parameters)
# =============================================================================
execution:
  # Polling interval in --wait mode (seconds)
  poll_interval: 30

  # Maximum wait duration in --wait mode (seconds); on timeout it exits and keeps
  # the job id for later lookup
  poll_timeout: 86400

  # Path where the job status is persisted: the job id is written after creation,
  # and the fine_tuned_model name is appended on success
  status_output_path: "results/finetune/job_status.json"
