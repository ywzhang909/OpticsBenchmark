[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optis_benchmark"
version = "1.0.0"
description = "Open-source optical design agent evaluation framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Optis Benchmark Contributors"}
]
keywords = [
    "optical-design",
    "agent-evaluation",
    "machine-learning",
    "optics",
    "benchmark"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics :: Optics",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.3.0",
    "anthropic>=0.8.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.13.0",
    "python-docx>=1.2.0",
    "accelerate>=1.14.0",
    "protobuf>=7.35.1",
    "google-genai>=1.0.0",
    "mistralai>=2.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
providers = [
    "boto3>=1.28.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
all = [
    "optis_benchmark[dev,providers,docs]",
]

[project.scripts]
optis = "src.llm_pred:main"

[project.urls]
Homepage = "https://github.com/ywzhang909/OpticsBenchmark"
Repository = "https://github.com/ywzhang909/OpticsBenchmark"
Issues = "https://github.com/ywzhang909/OpticsBenchmark/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ==============================================================
# PyTorch / CUDA 自适应配置
# 参考: https://uv.doczh.com/guides/integration/pytorch/#_3
# ==============================================================
# 定义 PyTorch 专用索引（explicit=true 确保仅 torch 系列包走此索引）
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# 默认使用 CPU 索引（跨平台安全）；运行 scripts/install_torch.py 后自动切换为 GPU 索引
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
